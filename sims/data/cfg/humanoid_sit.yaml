# if given, will override the device setting in gym. 
env: 
  # numEnvs: 4096
  envSpacing: 10
  episodeLength: 300
  isFlagrun: False
  enableDebugVis: False
  
  pdControl: True
  powerScale: 1.0
  controlFrequencyInv: 2 # 30 Hz
  stateInit: "Hybrid"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  localRootObs: False
  keyBodies: ["right_hand", "left_hand", "right_foot", "left_foot"]
  contactBodies: ["right_foot", "left_foot"]
  strikeBodyNames: ["pelvis", "head", "left_foot", "right_foot", "left_hand", "right_hand"]
  # strikeBodyNames: ["pelvis", "left_thigh", "left_shin", "left_foot", "right_thigh", "right_shin", "right_foot", "torso", "head", "left_upper_arm", "left_lower_arm", "left_hand", "right_upper_arm", "right_lower_arm", "right_hand"]
  terminationHeight: 0.25
  enableEarlyTermination: True

  enableSelfCollisionDetection: True
  enableTrackInitState: False

  task:
    enableTaskObs: True
    enableTaskUpdate: True
    enableContact: True

  motion_file: ["motion_data/samp/dataset_samp.yaml",] # "motion_data/100style/dataset_100style.yaml", "motion_data/couch/dataset_couch.yaml"]
  
  condition:
    enableConditionalDisc: True
    numClipDim: 512
    numConditionDim: 64
    motion_enc_ckpt: "output/motionclip_hsi/latest.pth"
  
  skill:
    skill: ["sitdown", "loco"]
    skillInitProb: [0.5, 0.5]
    skillDiscProb: [1, 0]
    skillSampleProb: [1, 0]
    
  obj:
    allowedObjs: ["chair", "armchair", "sofa", "stool", "bed"]
    heightMapDim: 20
    standpointScale: 1
    objFile: "scene_data/obj_info_3dfront.json"
    numObjPerScene: 4
    objRadiusMin: 2.0
    objRadiusMax: 4.0
    objAngleOffset: 10.0
    probUnderground: 0.1
    numMaxChildren: 4
    numPlans: 128
  
  asset:
    assetRoot: "sims/data/assets"
    assetFileName: "mjcf/amp_humanoid.xml"

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

sim:
  substeps: 2
  physx:
    num_threads: 4
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0

  flex:
    num_inner_iterations: 10
    warm_start: 0.25
